<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тренды монтажа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #000000);
    --card: var(--tg-theme-section-bg-color, #1c1c1e);
    --card2: color-mix(in srgb, var(--card) 85%, var(--text) 15%);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #3e88f7);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #3e88f7);
    --sep: color-mix(in srgb, var(--hint) 25%, transparent);
    --green: #34c759; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .page { display: none; padding: 12px 16px 16px; max-width: 560px; margin: 0 auto; }
  .page.active { display: block; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* hero */
  .hero { text-align: center; padding: 18px 0 20px; }
  .hero .label { color: var(--hint); font-size: 14px; font-weight: 600; }
  .hero .big { font-size: 56px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; margin: 4px 0 8px; }
  .hero .big small { font-size: 26px; color: var(--hint); font-weight: 700; margin-left: 4px; }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--card); color: var(--hint); }
  .chip.g { color: var(--green); background: color-mix(in srgb, var(--green) 16%, transparent); }
  .chip.o { color: var(--orange); background: color-mix(in srgb, var(--orange) 16%, transparent); }

  /* action tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .tile { background: var(--card); border-radius: 14px; padding: 12px 4px 10px; text-align: center; border: 0; color: var(--accent);
    font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .tile .ic { display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 6px; border-radius: 50%;
    background: var(--accent); font-size: 15px; }
  .tile:active, .row:active, .tab:active { opacity: .6; }

  /* cards */
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .card p { margin: 0; }
  .promo { background: linear-gradient(120deg, #2fb757, #7ed957); color: #062b12; cursor: pointer; position: relative; overflow: hidden; }
  .promo h3 { color: #062b12; font-size: 17px; }
  .promo p { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .promo .more { margin-top: 8px; font-size: 13px; font-weight: 700; opacity: .8; }
  .promo::after { content: "🧪"; position: absolute; right: -6px; bottom: -14px; font-size: 76px; opacity: .25; transform: rotate(-12deg); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; background: var(--accent); color: var(--accent-text);
    font: inherit; font-weight: 700; cursor: pointer; }
  .link { color: var(--link); font-weight: 600; cursor: pointer; }
  .muted { color: var(--hint); }
  .section-title { color: var(--hint); font-size: 13px; text-transform: uppercase; letter-spacing: .4px; font-weight: 600; margin: 18px 4px 8px; }

  /* list rows */
  .list { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; position: relative; cursor: default; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; height: 1px; background: var(--sep); }
  .row.click { cursor: pointer; }
  .av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--card2); }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .sub { color: var(--hint); font-size: 13.5px; margin-top: 2px; }
  .row .meta { color: var(--hint); font-size: 12px; margin-top: 4px; }
  .row .side { color: var(--hint); font-size: 13px; flex: none; align-self: center; }

  /* filter */
  .seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; border: 0; border-radius: 999px; padding: 7px 13px; background: var(--card); color: var(--text);
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }

  /* report viewer */
  .report { white-space: pre-wrap; word-wrap: break-word; }
  .report a { color: var(--link); text-decoration: none; }
  .report blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--accent); background: var(--card2); border-radius: 6px; }
  .report code, .report pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

  /* tab bar */
  .tabbar { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr); background: color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius: 26px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .tab { border: 0; background: none; color: var(--hint); font: inherit; font-size: 11px; font-weight: 600; padding: 6px 0 4px;
    border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }
</style>
</head>
<body>

<!-- Главная -->
<section class="page active" id="p-home">
  <div class="hero">
    <div class="label">Трендов в базе</div>
    <div class="big" id="h-total">—</div>
    <div class="chips" id="h-chips"></div>
  </div>
  <div class="tiles">
    <button class="tile" data-dir="short"><span class="ic">📱</span>Short</button>
    <button class="tile" data-dir="motion"><span class="ic">✨</span>Motion</button>
    <button class="tile" data-dir="cinema"><span class="ic">🎬</span>Кино</button>
    <button class="tile" data-dir="ai"><span class="ic">🤖</span>AI</button>
  </div>
  <div class="card promo" id="h-try" hidden>
    <h3>Попробуй сегодня</h3>
    <p id="h-try-text"></p>
    <div class="more">Открыть отчёт ›</div>
  </div>
  <div class="card" id="h-main" hidden>
    <h3>⚡ Главное за день</h3>
    <div class="report" id="h-main-text"></div>
  </div>
  <button class="btn" id="h-open">📰 Полный отчёт</button>
  <div class="section-title">Свежие тренды</div>
  <div class="list" id="h-fresh"></div>
</section>

<!-- Тренды -->
<section class="page" id="p-trends">
  <div class="seg" id="t-seg"></div>
  <div class="list" id="t-list"></div>
</section>

<!-- Архив -->
<section class="page" id="p-archive">
  <div class="section-title" style="margin-top:4px">Ежедневные отчёты</div>
  <div class="list" id="a-list"></div>
</section>

<!-- Выводы -->
<section class="page" id="p-insights">
  <div class="section-title" style="margin-top:4px">🧠 Выводы агента</div>
  <div class="list" id="i-list"></div>
  <div class="section-title">📅 События индустрии</div>
  <div class="list" id="e-list"></div>
</section>

<!-- Отчёт -->
<section class="page" id="p-report">
  <div class="card"><div class="report" id="r-body"></div></div>
</section>

<nav class="tabbar">
  <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button class="tab" data-tab="trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Тренды</button>
  <button class="tab" data-tab="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Архив</button>
  <button class="tab" data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>Выводы</button>
</nav>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {} }
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

const DIRS = [
  { key: 'all', label: 'Все' },
  { key: 'short', label: '📱 Short-form', rx: /short/i },
  { key: 'motion', label: '✨ Motion', rx: /motion/i },
  { key: 'cinema', label: '🎬 Кино и реклама', rx: /кино|клип|реклам/i },
  { key: 'ai', label: '🤖 AI и софт', rx: /ai|софт/i },
];
const STATUS = { '🆕': 'новый', '📈': 'растёт', '🔥': 'на пике', '📉': 'угасает' };
let DATA = { trends: [], insights: [], events: [], reports: [] };
let filter = 'all', currentTab = 'home';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? `${m[3]}.${m[2]}` : (d || ''); };
const fmtFull = d => { try { return new Date(d + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' }); } catch (e) { return d; } };
const statusIcon = s => (Object.keys(STATUS).find(k => (s || '').includes(k)) || '•');

// Безопасный рендер Telegram-HTML отчёта: только разрешённые теги
function safeHtml(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
  const ok = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'A', 'CODE', 'PRE', 'BLOCKQUOTE']);
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 1) {
        if (!ok.has(ch.tagName)) { walk(ch); ch.replaceWith(...ch.childNodes); return; }
        const href = ch.tagName === 'A' ? ch.getAttribute('href') : null;
        [...ch.attributes].forEach(a => ch.removeAttribute(a.name));
        if (href && /^https?:\/\//i.test(href)) ch.setAttribute('href', href);
        walk(ch);
      } else if (ch.nodeType !== 3) ch.remove();
    });
  };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}
function openLink(e) {
  const a = e.target.closest('a[href]'); if (!a) return;
  e.preventDefault(); const u = a.getAttribute('href');
  if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank', 'noopener');
}
document.addEventListener('click', openLink);

function paragraphs(report) { return (report || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean); }
function findBlock(report, word) {
  const ps = paragraphs(report); const i = ps.findIndex(p => p.toLowerCase().includes(word));
  if (i < 0) return null;
  let block = ps[i];
  // если заголовок отдельным абзацем — берём следующий абзац тоже
  if (block.split('\n').length === 1 && ps[i + 1]) block += '\n' + ps[i + 1];
  return block.replace(/^.*<\/b>\s*[—:-]?\s*/s, '').trim() || block;
}

function trendRow(t) {
  return `<div class="row"><div class="av">${statusIcon(t.status)}</div><div class="body">
    <div class="title">${esc(t.name)}</div>
    ${t.note ? `<div class="sub">${esc(t.note)}</div>` : ''}
    <div class="meta">${esc(t.dir)} · впервые ${fmtDate(t.first)} · упоминаний ${t.count}</div></div></div>`;
}

function renderHome() {
  const tr = DATA.trends;
  $('#h-total').innerHTML = `${tr.length}<small>шт</small>`;
  const n = k => tr.filter(t => (t.status || '').includes(k)).length;
  const chips = [];
  if (n('🆕')) chips.push(`<span class="chip g">🆕 ${n('🆕')} новых</span>`);
  if (n('📈')) chips.push(`<span class="chip g">📈 ${n('📈')} растут</span>`);
  if (n('🔥')) chips.push(`<span class="chip o">🔥 ${n('🔥')} на пике</span>`);
  if (DATA.updated) chips.push(`<span class="chip">обновлено ${fmtDate(DATA.updated)}</span>`);
  $('#h-chips').innerHTML = chips.join('');

  const last = DATA.reports[0];
  const tryText = last && findBlock(last.html, 'попробуй');
  $('#h-try').hidden = !tryText;
  if (tryText) $('#h-try-text').innerHTML = safeHtml(tryText.replace(/<a [^>]*>.*?<\/a>/g, ''));
  const mainText = last && findBlock(last.html, 'главное');
  $('#h-main').hidden = !mainText;
  if (mainText) $('#h-main-text').innerHTML = safeHtml(mainText);
  $('#h-open').hidden = !last;

  const fresh = [...tr].sort((a, b) => (b.first || '').localeCompare(a.first || '') || b.count - a.count).slice(0, 5);
  $('#h-fresh').innerHTML = fresh.length ? fresh.map(trendRow).join('') : '<div class="empty">База пока пустая — первый отчёт её наполнит</div>';
}

function renderTrends() {
  $('#t-seg').innerHTML = DIRS.map(d => `<button data-f="${d.key}" class="${d.key === filter ? 'on' : ''}">${d.label}</button>`).join('');
  const d = DIRS.find(x => x.key === filter);
  const rank = s => ({ '🔥': 4, '📈': 3, '🆕': 2, '📉': 0 }[statusIcon(s)] ?? 1);
  const items = DATA.trends.filter(t => !d.rx || d.rx.test(t.dir))
    .sort((a, b) => b.count - a.count || rank(b.status) - rank(a.status) || (b.last || '').localeCompare(a.last || ''));
  $('#t-list').innerHTML = items.length ? items.map(trendRow).join('') : '<div class="empty">Пока нет трендов в этом направлении</div>';
}

function renderArchive() {
  $('#a-list').innerHTML = DATA.reports.length ? DATA.reports.map((r, i) => `
    <div class="row click" data-report="${i}"><div class="av">📄</div><div class="body">
      <div class="title">${esc(fmtFull(r.date))}</div><div class="sub">${esc(r.preview || '')}</div></div>
      <div class="side">›</div></div>`).join('') : '<div class="empty">Отчётов пока нет</div>';
}

function renderInsights() {
  const li = (arr, icon) => arr.length ? arr.map(x => `<div class="row"><div class="av">${icon}</div><div class="body"><div>${esc(x)}</div></div></div>`).join('') : '<div class="empty">Пока пусто</div>';
  $('#i-list').innerHTML = li(DATA.insights, '💡');
  $('#e-list').innerHTML = li(DATA.events, '📅');
}

function show(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'p-' + tab));
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab !== 'report') currentTab = tab;
  if (tg) { tab === 'report' ? tg.BackButton.show() : tg.BackButton.hide(); }
  window.scrollTo(0, 0);
}
function openReport(i) {
  const r = DATA.reports[i]; if (!r) return;
  $('#r-body').innerHTML = safeHtml(r.html); show('report');
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab'); if (tab) { haptic(); show(tab.dataset.tab); return; }
  const tile = e.target.closest('.tile'); if (tile) { haptic(); filter = tile.dataset.dir; renderTrends(); show('trends'); return; }
  const f = e.target.closest('[data-f]'); if (f) { haptic(); filter = f.dataset.f; renderTrends(); return; }
  const r = e.target.closest('[data-report]'); if (r) { haptic(); openReport(+r.dataset.report); return; }
  if (e.target.closest('#h-try, #h-open')) { haptic(); openReport(0); }
});
if (tg) tg.BackButton.onClick(() => show(currentTab));

fetch('data.json?t=' + Date.now()).then(r => r.json()).then(d => {
  DATA = Object.assign(DATA, d);
  renderHome(); renderTrends(); renderArchive(); renderInsights();
}).catch(() => { $('#h-fresh').innerHTML = '<div class="empty">Не удалось загрузить данные. Попробуйте позже.</div>'; });
</script>
</body>
</html>
